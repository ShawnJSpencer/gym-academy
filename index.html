<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym Academy">
<meta name="theme-color" content="#7b3fe4">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.json">
<title>Spencer Gymnastics Academy</title>
<style>
:root{--pink:#ff4fa3;--purple:#7b3fe4;--ink:#2b1d4e;--soft:#f6f0ff;--card:#fff;--ok:#18b26b;--bad:#ef4466;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);
 background:linear-gradient(160deg,#ffe3f1 0%,#efe4ff 45%,#dff1ff 100%);background-attachment:fixed;
 padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);-webkit-user-select:none;user-select:none}
#app{max-width:1100px;margin:0 auto;padding:12px 14px 70px}
h1,h2,h3{margin:0}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.btn{background:var(--purple);color:#fff;border-radius:16px;padding:12px 18px;font-weight:800;font-size:16px;box-shadow:0 4px 0 #5427b0;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #5427b0}
.btn.pink{background:var(--pink);box-shadow:0 4px 0 #c42c7a}
.btn.ghost{background:#fff;color:var(--purple);box-shadow:0 4px 0 #d7c8f6}
.btn.small{padding:8px 12px;font-size:14px;border-radius:12px}
.btn:disabled{opacity:.45}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.top .title{flex:1;min-width:200px}
.title h1{font-size:24px;font-weight:900;background:linear-gradient(90deg,var(--pink),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
.title .sub{font-size:13px;opacity:.7;font-weight:700}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{background:#fff;border-radius:999px;padding:7px 12px;font-weight:800;font-size:14px;box-shadow:0 2px 8px #7b3fe41a}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.lvl{background:#fff;border-radius:22px;padding:14px;box-shadow:0 6px 18px #7b3fe41f;text-align:left;position:relative;overflow:hidden}
.lvl .em{font-size:34px}
.lvl h3{font-size:19px;font-weight:900;margin-top:4px}
.lvl .ages{font-weight:800;font-size:13px;opacity:.75}
.lvl .cnt{position:absolute;right:14px;top:14px;font-weight:900;font-size:13px;background:var(--soft);border-radius:999px;padding:4px 10px}
.lvl .stripe{position:absolute;left:0;top:0;bottom:0;width:8px}
.lvl .faces{display:flex;margin-top:8px;min-height:34px}
.lvl .faces svg{width:34px;height:34px;margin-right:-8px;border-radius:50%;border:2px solid #fff}
.tag{display:inline-block;font-size:11px;font-weight:900;padding:3px 8px;border-radius:999px;background:#ffe0ef;color:#c42c7a;margin-top:4px}
.sect{font-weight:900;font-size:15px;margin:18px 0 8px;opacity:.8;text-transform:uppercase;letter-spacing:.06em}
.banner{background:linear-gradient(90deg,#ff7ac0,#9b6bff);color:#fff;border-radius:18px;padding:12px 14px;font-weight:800;display:flex;align-items:center;gap:10px;margin-bottom:12px}
.banner .btn{margin-left:auto}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.gcard{background:#fff;border-radius:18px;padding:8px;text-align:center;box-shadow:0 4px 12px #7b3fe41a;position:relative}
.gcard svg{width:100%;height:auto;border-radius:14px}
.gcard .nm{font-weight:900;font-size:15px}
.gcard .meta{font-size:12px;font-weight:700;opacity:.7}
.ready{position:absolute;top:6px;right:6px;background:#ffd84d;border-radius:999px;font-size:11px;font-weight:900;padding:3px 7px}
.events{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ev{background:#fff;border-radius:20px;padding:12px;box-shadow:0 4px 12px #7b3fe41a}
.ev h3{font-size:18px;font-weight:900;margin-bottom:8px}
.sk{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:14px;padding:10px;margin-top:8px}
.sk .n{flex:1;font-weight:800}
.sk .m{font-size:12px;font-weight:700;opacity:.7}
/* practice */
.stage{background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 6px 18px #7b3fe424;position:relative}
.stage svg{display:block;width:100%;height:auto}
.stage .lbl{position:absolute;left:10px;top:10px;background:#ffffffd9;border-radius:999px;padding:5px 11px;font-weight:900;font-size:14px}
.stage .ctrl{position:absolute;right:10px;top:10px;display:flex;gap:6px}
.who{display:flex;align-items:center;gap:10px;background:#fff;border-radius:18px;padding:8px 12px;margin-top:10px;box-shadow:0 4px 12px #7b3fe41a}
.who svg{width:54px;height:54px;border-radius:50%}
.who .nm{font-weight:900;font-size:18px}
.bar{height:12px;background:#eee6fb;border-radius:99px;overflow:hidden;margin-top:4px;min-width:140px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--purple));border-radius:99px;transition:width .5s}
.line{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end;max-width:45%}
.line svg{width:30px;height:30px;border-radius:50%;opacity:.55}
.line svg.cur{opacity:1;outline:3px solid var(--pink)}
.line svg.dn{opacity:.25}
.ask{margin-top:12px;background:#fff;border-radius:20px;padding:14px;box-shadow:0 4px 12px #7b3fe41a;min-height:90px}
.ask .q{font-weight:900;font-size:18px;margin-bottom:10px;text-align:center}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.opt{background:var(--soft);border-radius:16px;padding:16px 12px;font-weight:800;font-size:17px;box-shadow:0 4px 0 #ddd0f5}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 #ddd0f5}
.opt.right{background:#d8f8e7;box-shadow:0 4px 0 #9fe0bf}
.opt.wrong{background:#ffe0e6;box-shadow:0 4px 0 #f5a9b8}
.opt.dim{opacity:.45}
.msg{text-align:center;font-weight:800;font-size:17px;margin:4px 0 10px}
.msg.ok{color:var(--ok)}.msg.no{color:var(--bad)}
.coach{display:inline-block;background:#fff3c4;border-radius:14px;padding:6px 12px;font-weight:800;margin:4px auto 8px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
/* modal */
#modal{position:fixed;inset:0;background:#2b1d4e88;display:none;align-items:center;justify-content:center;padding:14px;z-index:20;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#modal.on{display:flex}
.mbox{background:#fff;border-radius:26px;max-width:560px;width:100%;max-height:92vh;overflow:auto;padding:18px;box-shadow:0 20px 50px #2b1d4e55;animation:pop .25s ease}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.newtop{display:flex;gap:14px;align-items:center}
.newtop svg{width:130px;height:auto;border-radius:20px;flex:none}
.newtop h2{font-size:26px;font-weight:900}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:15px;margin-top:6px}
.facts b{opacity:.6;font-weight:800}
.place{display:grid;gap:8px;margin-top:14px}
.place button{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:16px;padding:12px 14px;font-weight:800;font-size:16px;text-align:left}
.place button .a{margin-left:auto;font-size:13px;opacity:.7}
.place button.lock{opacity:.45}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:16px;font-weight:800;z-index:40;max-width:90%;text-align:center;animation:pop .25s}
.conf{position:fixed;pointer-events:none;z-index:50;font-size:26px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(70vh) rotate(540deg);opacity:0}}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:20px}
.pick button{background:#fff;border-radius:24px;padding:22px 10px;font-size:22px;font-weight:900;box-shadow:0 6px 0 #d7c8f6}
.pick button span{display:block;font-size:52px}
.skl{display:flex;align-items:center;gap:8px;margin:5px 0;font-weight:700;font-size:14px}
.skl .bar{flex:1}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.tab{background:#fff;border-radius:16px;padding:8px 14px;font-weight:800;box-shadow:0 2px 8px #7b3fe41a}.tab small{display:block;font-size:11px;opacity:.7}.tab.on{background:var(--purple);color:#fff}
.mrow{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:12px;font-weight:700;font-size:14px}.mrow:nth-child(odd){background:var(--soft)}.mrow .r{margin-left:auto;font-weight:900;font-size:16px;white-space:nowrap;padding-left:8px}.mrow.own{background:#fff1c9!important}.mrow svg{width:30px;height:30px;border-radius:50%;flex:none}
.podium{display:flex;gap:10px;justify-content:center;align-items:flex-end;margin-top:6px}.pd{background:#fff;border-radius:20px;padding:10px;text-align:center;width:150px;box-shadow:0 6px 18px #7b3fe41f}.pd svg{width:80px;border-radius:50%}.pd .nm{font-weight:900}.pd .meta{font-size:11px;opacity:.6;font-weight:700}.pd .sc{font-weight:900;font-size:20px;color:var(--purple)}.pd.p1{padding-bottom:34px;border:3px solid #ffd84d}.pd.p2{padding-bottom:20px}
table.res{width:100%;border-collapse:collapse;font-size:14px}table.res td,table.res th{padding:6px;text-align:center;border-bottom:1px solid #eee6fb}table.res td:first-child{text-align:left}
.hint{font-size:13px;opacity:.7;font-weight:700;text-align:center;margin-top:8px}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"><div class="mbox" id="mbox"></div></div>
<script>
"use strict";
/* ============================ DATA ============================ */
const COACHES=[{n:'Dad',e:'🧢'},{n:'Mom',e:'🌸'},{n:'Emma',e:'🦄'},{n:'Nora',e:'🐰'}];
const LEVELS=[
 {id:'mini',name:'Mini Flippers',em:'🐣',min:3,max:4,entry:1,set:'mini',desc:'Toddler & preschool tumbling',col:'#ff9ccc'},
 {id:'kinder',name:'Kinder Kartwheelers',em:'🌈',min:5,max:6,entry:1,set:'kinder',desc:'Kindergarten class',col:'#ffc94d'},
 {id:'sparkle',name:'Sparkle Starters',em:'✨',min:7,max:10,entry:1,set:'sparkle',desc:'Beginner class',col:'#5fd6a6'},
 {id:'stars',name:'Shooting Stars',em:'🌠',min:11,max:16,entry:1,set:'sparkle',desc:'Beginner class for big kids',col:'#4cc3e8'},
 {id:'rockets',name:'Rising Rockets',em:'🚀',min:7,max:16,set:'rockets',desc:'Intermediate class',col:'#6f9bff'},
 {id:'amethyst',name:'Team Amethyst',em:'💜',min:7,max:16,team:1,set:'amethyst',desc:'Competition team · Level 1',col:'#a874ff'},
 {id:'sapphire',name:'Team Sapphire',em:'💙',min:9,max:16,team:1,set:'sapphire',desc:'Competition team · Level 2',col:'#3f6bff'},
 {id:'ruby',name:'Team Ruby',em:'❤️',min:11,max:16,team:1,set:'ruby',desc:'Competition team · Level 3',col:'#ff3d5e'},
 {id:'diamond',name:'Team Diamond',em:'💎',min:13,max:16,team:1,set:'diamond',desc:'Elite competition team',col:'#36cfe6'}
];
const LV=Object.fromEntries(LEVELS.map(l=>[l.id,l]));
const PROMOTE_NEED=6;
const EVENTS=[{id:'bars',n:'Bars',e:'🤸'},{id:'beam',n:'Beam',e:'🩰'},{id:'vault',n:'Vault',e:'🚀'},{id:'floor',n:'Floor',e:'⭐'}];

const FAULTS={
 toes:{bad:"Didn't point her toes",good:"Pointed her toes",fix:"Point those toes like a ballerina!"},
 knees:{bad:"Bent her knees",good:"Kept her legs straight",fix:"Squeeze those knees straight!"},
 arms:{bad:"Bent her arms",good:"Kept her arms straight",fix:"Lock those elbows — strong arms!"},
 together:{bad:"Let her legs come apart",good:"Kept her legs together",fix:"Glue those legs together!"},
 head:{bad:"Let her head drop out of line",good:"Kept her head in line",fix:"Keep your head between your arms!"},
 lookdown:{bad:"Looked down at her feet",good:"Kept her eyes forward",fix:"Eyes up — look at the end of the beam!"},
 chin:{bad:"Forgot to tuck her chin",good:"Tucked her chin to her chest",fix:"Chin to chest, like you're holding an orange!"},
 landing:{bad:"Took a step on the landing",good:"Stuck her landing",fix:"Bend your knees and STICK it!"},
 ears:{bad:"Didn't reach her arms by her ears",good:"Reached her arms up by her ears",fix:"Squeeze your ears with your arms!"},
 finish:{bad:"Forgot to finish with her arms up",good:"Finished with her arms up and a smile",fix:"Finish strong — arms up and smile!"},
 split:{bad:"Didn't open into a full split",good:"Hit a full split",fix:"Reach those legs wide apart!"},
 height:{bad:"Didn't get enough height",good:"Got great height",fix:"Jump up, up, UP!"},
 balance:{bad:"Wobbled and waved her arms",good:"Stayed steady and balanced",fix:"Tight tummy — stay steady!"},
 tuck:{bad:"Didn't pull into a tight tuck",good:"Pulled into a tight tuck",fix:"Knees to your chest — tight ball!"},
 hold:{bad:"Didn't hold it long enough",good:"Held it for a full count",fix:"Hold it… 1… 2… 3!"},
 releve:{bad:"Dropped her heels down",good:"Stayed up high on her toes",fix:"Up on your tippy toes!"},
 tarms:{bad:"Dropped her arms down",good:"Held her arms out like airplane wings",fix:"Airplane arms out wide!"},
 cast:{bad:"Didn't cast high enough",good:"Cast up nice and high",fix:"Push the bar away and swing those legs up!"}
};

/* ============================ RANDOM ============================ */
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};

const FIRST=("Abigail Addison Adeline Aisha Alana Alice Alina Amara Amelia Ana Annie Aria Ariana Ava Avery Bailey Bella Bianca Blair Brielle Brooke Callie Camila Caroline Charlotte Chloe Clara Cora Daisy Delilah Eden Eliana Eliza Ella Ellie Eloise Elsie Emery Emilia Esme Eva Evelyn Faith Fiona Freya Gabriella Gemma Georgia Grace Gracie Hadley Hailey Hannah Harper Hazel Hope Imani Isabel Isla Ivy Jade Jane Jasmine Josie Julia June Juniper Kaia Kali Kate Kayla Keira Kennedy Kenzie Kinsley Lacey Layla Leah Lena Lila Lily Lola Lucy Luna Lydia Mabel Mackenzie Madison Mae Maeve Maggie Maisie Malia Margot Maria Mariana Maya Mckenna Mia Mila Millie Molly Naomi Natalie Nina Noelle Nova Olive Olivia Paige Penelope Piper Poppy Quinn Raegan Reese Riley Rosalie Rose Sadie Sage Samantha Sara Savannah Scarlett Selena Serena Sienna Sloane Sofia Sophie Stella Summer Sydney Talia Tessa Valentina Vera Violet Willa Willow Winnie Wren Zara Zoe Zuri Ainsley Brynn Celeste Dahlia Elodie Felicity Greta Harlow Iris Kiara Lainey Marlee Navy Oaklee Priya Remi Saylor Tatum Vivian Yara").split(' ');
const LAST=("Anderson Baker Bennett Brooks Carter Chen Clark Collins Cooper Davis Diaz Evans Fisher Flores Foster Garcia Gray Green Hall Harris Hayes Hughes Jensen Johnson Kim King Larsen Lee Lewis Lopez Martin Mitchell Morgan Murphy Nelson Nguyen Olsen Parker Patel Perez Peterson Price Reed Rivera Roberts Ross Russell Sanders Scott Shaw Taylor Thompson Turner Walker Ward Watson White Williams Wilson Wright Young Ramos Bishop Hart Lund Cho Silva").split(' ');
const HAIR=[['Golden Blonde','#e9c25d'],['Platinum Blonde','#f3e6b8'],['Strawberry Blonde','#eaa46a'],['Copper Red','#c9572b'],['Auburn','#8e3a1e'],['Honey Brown','#b9844a'],['Light Brown','#a2714a'],['Chestnut Brown','#74462a'],['Dark Brown','#4a2c1b'],['Jet Black','#1c1614']];
const STYLES=['Ponytail','High Bun','Pigtails','Braid','Short Bob','Curly Puff','Space Buns','Long & Wavy'];
const SKIN=['#fde4d0','#f7d0b0','#ecb991','#d69d71','#b57d52','#8d5c3b','#6a4029'];
const EYES=[['Blue','#3b7fd4'],['Green','#3d9a58'],['Hazel','#8b7a38'],['Brown','#6b3e1f'],['Dark Brown','#3b2213'],['Gray','#7c8c99']];
const LEOS=[['Hot Pink','#ec3c8f'],['Purple','#7b3fe4'],['Sky Blue','#1fa7e0'],['Teal','#13b3a0'],['Orange','#f57a1d'],['Red','#e63946'],['Lavender','#a98bf0'],['Navy','#2b3f9e'],['Lime','#55c23a'],['Gold','#e0aa12'],['Magenta','#c026d3'],['Coral','#ff6f61'],['Turquoise','#20c4d8'],['Black Sparkle','#2a2340']];
const ACC=['#ffffff','#ffd84d','#ff9ccc','#9be7ff','#c5a6ff','#ff6b6b','#7ee2a8'];
const TRAITS=['Brave','Giggly','Shy at first','Super focused','Bouncy','Silly','Determined','Calm','Chatty','Kind-hearted','Fearless','Creative','Dramatic','Hard-working','Cheerful','Curious'];
const ANIMALS=['horses','puppies','bunnies','dolphins','kittens','penguins','llamas','sloths','owls','foxes','koalas','pandas','hedgehogs','otters'];
const SNACKS=['strawberries','popcorn','goldfish crackers','mac and cheese','apple slices','cheese sticks','grapes','pretzels','mango','watermelon','string cheese','banana bread','fruit snacks','blueberries'];
const DREAMS=['go to the Olympics','do a back handspring','win a gold medal','be a gymnastics coach','do a double back','be on Team Diamond','do a cartwheel on the beam','do a split'];

/* ============================ SAVE ============================ */
let COACH=null,S=null;
const KEY=n=>'sga_save_v1_'+n;
function load(n){try{const t=localStorage.getItem(KEY(n));return t?JSON.parse(t):null}catch(e){return null}}
let syncHook=null;
function saveLocal(){if(!COACH||!S)return;try{localStorage.setItem(KEY(COACH),JSON.stringify(S))}catch(e){}}
function save(){if(!COACH||!S)return;S.u=Date.now();saveLocal();if(syncHook)syncHook()}
function newSave(){const s={v:1,girls:[],queue:[],used:[],nid:1,play:0,nextArr:1200,nextSea:1800,pts:0,season:1,hof:[],st:{ok:0,no:0,mast:0}};S=s;for(let i=0;i<20;i++)s.queue.push(makeGirl());return s}

function makeGirl(){
 const used=new Set(S.used);let pool=FIRST.filter(n=>!used.has(n));let first;
 if(pool.length)first=pick(pool);else first=pick(FIRST);
 S.used.push(first);
 const h=pick(HAIR),e=pick(EYES),l=pick(LEOS);
 return{id:S.nid++,first,last:pick(LAST),age:3+rnd(14),hair:h[0],hairC:h[1],style:pick(STYLES),eye:e[0],eyeC:e[1],
  skin:pick(SKIN),leo:l[0],leoC:l[1],acc:pick(ACC),freck:Math.random()<.25,trait:pick(TRAITS),fav:pick(EVENTS).n,
  animal:pick(ANIMALS),snack:pick(SNACKS),dream:pick(DREAMS),talent:Math.random(),lvl:null,sk:{},joined:S.season};
}
const G=id=>S.girls.find(g=>g.id===id);
const fullName=g=>g.first+' '+g.last;

/* ============================ PORTRAIT ============================ */
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt;r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));return'#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)}
function portrait(g){
 const hc=g.hairC,sk=g.skin,ac=g.acc,lc=g.leoC,hd=shade(hc,-25);
 let back='',front='';
 switch(g.style){
  case'Ponytail':back=`<path d="M68 30 Q96 40 86 84 Q80 66 68 50Z" fill="${hc}" stroke="${hd}" stroke-width="1"/>`;front=`<circle cx="70" cy="32" r="4" fill="${ac}"/>`;break;
  case'High Bun':back=`<circle cx="50" cy="19" r="12" fill="${hc}" stroke="${hd}" stroke-width="1"/>`;front=`<rect x="40" y="27" width="20" height="5" rx="2.5" fill="${ac}"/>`;break;
  case'Pigtails':back=`<ellipse cx="22" cy="54" rx="9" ry="16" fill="${hc}" stroke="${hd}"/><ellipse cx="78" cy="54" rx="9" ry="16" fill="${hc}" stroke="${hd}"/>`;front=`<circle cx="26" cy="40" r="4" fill="${ac}"/><circle cx="74" cy="40" r="4" fill="${ac}"/>`;break;
  case'Braid':back=[0,1,2,3,4].map(i=>`<ellipse cx="${71+i*1.5}" cy="${58+i*9}" rx="6" ry="6.5" fill="${hc}" stroke="${hd}"/>`).join('');front=`<circle cx="77" cy="102" r="3.5" fill="${ac}"/>`;break;
  case'Short Bob':back=`<path d="M23 52 Q20 20 50 19 Q80 20 77 52 L78 70 Q71 75 67 68 L33 68 Q29 75 22 70Z" fill="${hc}" stroke="${hd}"/>`;front=`<circle cx="30" cy="38" r="3.5" fill="${ac}"/>`;break;
  case'Curly Puff':back=`<g fill="${hc}" stroke="${hd}">`+[[50,15,13],[34,20,11],[66,20,11],[25,33,10],[75,33,10]].map(c=>`<circle cx="${c[0]}" cy="${c[1]}" r="${c[2]}"/>`).join('')+'</g>';front=`<rect x="34" y="27" width="32" height="5" rx="2.5" fill="${ac}"/>`;break;
  case'Space Buns':back=`<circle cx="29" cy="21" r="10" fill="${hc}" stroke="${hd}"/><circle cx="71" cy="21" r="10" fill="${hc}" stroke="${hd}"/>`;front=`<circle cx="37" cy="28" r="3" fill="${ac}"/><circle cx="63" cy="28" r="3" fill="${ac}"/>`;break;
  default:back=`<path d="M25 40 Q18 72 27 96 Q38 90 36 72 L64 72 Q62 90 73 96 Q82 72 75 40Z" fill="${hc}" stroke="${hd}"/>`;front=`<path d="M64 31 l7 -5 l0 10z M64 31 l-7 -5 l0 10z" fill="${ac}"/>`;
 }
 const young=g.age<=6,er=young?5:4.3;

 const P={};P.hip=[0,0];P.neck=add(P.hip,th,L.TO);P.sh=add(P.neck,th+180,2.2*s);
 P.head=add(P.neck,th+p.hd*0.5,L.HR+1.2*s);
 for(const sd of['L','R']){
  const td=th+180-p['t'+sd];P['k'+sd]=add(P.hip,td,L.TH);const shd=td+p['k'+sd];P['a'+sd]=add(P['k'+sd],shd,L.SH);P['t'+sd]=add(P['a'+sd],shd-p['f'+sd],L.FT);
  const ud=th+180-p['a'+sd];P['e'+sd]=add(P.sh,ud,L.UA);P['h'+sd]=add(P['e'+sd],ud-p['e'+sd],L.FA);
 }
 const keys=Object.keys(P);
 for(const k of keys)P[k][0]*=sx;
 let hx=p.x,hy=sc.ground(p.x)-p.h;
 const pts=()=>keys.map(k=>[P[k][0]+hx,P[k][1]+hy]);
 if(p.g>0.001){let low=-1e9;for(const k of keys){let y=P[k][1]+hy;if(k==='head')y+=L.HR;if(k==='neck'||k==='sh')y+=4*s;if(y>low)low=y}hy+=p.g*(sc.ground(p.x)-low)}

}

/* ---- faults ---- */
function applyFault(F,fault,A){
 if(!fault)return;
 const M={toes:f=>{if(f.pt){f.fL=80;f.fR=80}},knees:f=>{if(f.st){f.kL+=45;f.kR+=45}},arms:f=>{if(f.ast){f.eL+=55;f.eR+=55}},
  together:f=>{if(f.tog){f.tL+=24;f.tR-=24}},ears:f=>{if(f.up){f.aL=Math.min(f.aL,110);f.aR=Math.min(f.aR,110)}},finish:f=>{if(f.fin){f.aL=4;f.aR=4}},
  split:f=>{if(f.sp){f.tL*=.45;f.tR*=.45}},height:f=>{if(f.air)f.h=38+(f.h-38)*.5},tuck:f=>{if(f.tk){f.tL*=.55;f.kL*=.4;f.tR*=.55;f.kR*=.4}},
  hold:f=>{if(f.hold)f.dt*=.18},releve:f=>{if(f.rel){f.fL=90;f.fR=90}},tarms:f=>{if(f.tarm){f.aL=6;f.aR=6}},
  cast:f=>{if(f.cast){f.rot=8+(f.rot-8)*.38;f.aL=f.rot;f.aR=f.rot}},chin:f=>{if(f.tk)f.hd-=55}};
 if(M[fault])F.forEach(M[fault]);
 if(fault==='head'||fault==='lookdown')F.forEach((f,i)=>{if(i>0&&i<F.length-2)f.hd+=45});
 if(fault==='balance')A.wobble=1;
 if(fault==='landing'){let i=-1;F.forEach((f,j)=>{if(f.land)i=j});if(i>0){const L=F[i],pv=F[i-1],d=Math.sign(L.x-pv.x)||1;
  const st=Object.assign({},L,{dt:230,tL:42,kL:22,tR:-20,kR:12,aL:130,aR:40,land:0});st.x=L.x+d*15;
  const rc=Object.assign({},L,{dt:320,land:0});rc.x=L.x+d*18;for(let j=i+1;j<F.length;j++)F[j].x+=d*18;F.splice(i+1,0,st,rc);}}
}
function buildAnim(sk,girl,fault){
 const s=gScale(girl.age),sc=scene(sk.ev,sk.v,sk.bar);
 const c={s,ground:sc.ground,bar:sc.bar,tbl:sc.tbl,hip:f=>{const W=solve(f,s,sc);return{x:W.hip[0],y:W.hip[1]}}};
 const B=mkB(sk.x,1);sk.b(B,c);
 const F=B.F.map(f=>Object.assign({},f)),A={F,s,sc,wobble:0};
 applyFault(F,fault,A);
 const anc=sc.bar||sc.tbl;if(anc)for(const f of F)if(!f.b){f.bx=anc.x;f.by=anc.y}
 for(const f of F){const W=solve(f,s,sc);f.x=W.hip[0];f.h=sc.ground(f.x)-W.hip[1]}
 let T=0;F.forEach((f,i)=>{if(i)T+=Math.max(30,f.dt);f.T=T});A.dur=T;return A;
}
function sample(A,T){
 const F=A.F;let i=1;while(i<F.length-1&&F[i].T<T)i++;
 if(T<=0)i=1;const a=F[i-1],b=F[i],p0=F[Math.max(0,i-2)],p3=F[Math.min(F.length-1,i+1)];
 let u=(T-a.T)/((b.T-a.T)||1);u=Math.max(0,Math.min(1,u));
 const o={},u2=u*u,u3=u2*u;
 for(const k of NUM){const P0=p0[k],P1=a[k],P2=b[k],P3=p3[k];
  o[k]=0.5*((2*P1)+(-P0+P2)*u+(2*P0-5*P1+4*P2-P3)*u2+(-P0+3*P1-3*P2+P3)*u3);}

let RAF=0,SPEED=1;
function play(A,girl,cb){
 cancelAnimationFrame(RAF);const el=document.getElementById('fig');if(!el)return;
 let t0=null;const end=A.dur+250;
 const step=ts=>{if(t0===null)t0=ts;const T=(ts-t0)*SPEED*(SCREEN==='meet'?1.5:1);const p=sample(A,Math.min(T,A.dur));
  const W=solve(p,A.s,A.sc);const e2=document.getElementById('fig');if(!e2)return;e2.innerHTML=drawGirl(W,girl);
  if(T<end)RAF=requestAnimationFrame(step);else cb&&cb();};
 RAF=requestAnimationFrame(step);
}
function stillPose(sk,girl){const A=buildAnim(sk,girl,null);const W=solve(sample(A,0),A.s,A.sc);return drawGirl(W,girl)}

const mastered=(g,set)=>(SETS[set||LV[g.lvl].set]||[]).filter(s=>g.sk[s.id]&&g.sk[s.id].done).length;
function nextLevel(g){const i=LEVELS.findIndex(l=>l.id===g.lvl);const l=LEVELS[i];
 if(l.id==='mini')return LV.kinder;if(l.id==='kinder')return g.age<=10?LV.sparkle:LV.stars;if(l.id==='sparkle'||l.id==='stars')return LV.rockets;
 if(l.id==='diamond')return null;return LEVELS[i+1];}

function whoBar(){

 <div class="line">${PR.ids.map((id,i)=>{const gg=G(id);return face(gg).replace('<svg ',`<svg class="${i===PR.i?'cur':i<PR.i?'dn':''}" `)}).join('')}</div>`;
}
function lbl(t){const e=document.getElementById('slbl');if(e)e.textContent=t}
function turn(){
 if(PR.i>=PR.ids.length)return done();
 const g=G(PR.ids[PR.i]);if(!g){PR.i++;return turn()}
 const sk=SK[PR.skid],p=prog(g,sk.id),ask=document.getElementById('ask');
 whoBar();
 if(sk.pre&&!(g.sk[sk.pre]&&g.sk[sk.pre].done)){PR.fault=null;lbl(`${g.first} · not ready yet`);const fg=document.getElementById('fig');if(fg)fg.innerHTML=stillPose(sk,g);
  ask.innerHTML=`<div class="msg no">🔒 ${g.first} needs to master the ${SK[sk.pre].n} before she can learn the ${sk.n}.</div><div class="row"><button class="btn" onclick="nextG()">Next gymnast →</button></div>`;return}
 if(p.done){PR.fault=null;lbl(`${g.first} · already mastered`);ask.innerHTML=`<div class="q">Watch ${g.first}! 👀</div>`;
  play(buildAnim(sk,g,null),g,()=>{ask.innerHTML=`<div class="msg ok">✨ Perfect! ${g.first} has already mastered the ${sk.n}.</div><div class="row"><button class="btn" onclick="nextG()">Next gymnast →</button></div>`});return}
 let cand=sk.f.filter(x=>x!==p.last);PR.fault=pick(cand.length?cand:sk.f);
 PR.opts=shuffle([PR.fault,...shuffle(sk.f.filter(x=>x!==PR.fault)).slice(0,2)]);
 lbl(`${g.first}'s turn`);ask.innerHTML=`<div class="q">Watch ${g.first} carefully… 👀</div><div class="hint">Something will be a little off. Can you spot it?</div>`;

}
function askGuess(){
 const g=G(PR.ids[PR.i]);
 document.getElementById('ask').innerHTML=`<div class="q">What did ${g.first} do WRONG?</div>
 <div class="opts">${PR.opts.map((o,i)=>`<button class="opt" id="op${i}" onclick="guess(${i})">${o===PR.fault?FAULTS[o].bad:FAULTS[o].good}</button>`).join('')}</div>

}
function rewatch(){const g=G(PR.ids[PR.i]);lbl(`${g.first} · again`);play(buildAnim(SK[PR.skid],g,PR.fault),g,()=>{})}
function guess(i){
 const g=G(PR.ids[PR.i]),sk=SK[PR.skid],p=prog(g,sk.id),o=PR.opts[i],ask=document.getElementById('ask');
 ask.querySelectorAll('.row').forEach(r=>r.remove());
 PR.opts.forEach((x,j)=>{const b=document.getElementById('op'+j);b.disabled=true;b.onclick=null;if(x===PR.fault)b.classList.add(o===x?'right':'wrong');else if(j===i)b.classList.add('wrong');else b.classList.add('dim')});
 if(o===PR.fault){
  p.p++;p.last=PR.fault;S.pts+=10;S.st.ok++;PR.ok++;const now=p.p>=p.need;
  if(now){p.done=1;S.st.mast++;S.pts+=50;PR.newM.push(g.first)}
  save();whoBar();
  ask.insertAdjacentHTML('beforeend',`<div class="msg ok" style="margin-top:12px">✅ Great eye, Coach! +10 ⭐</div><div style="text-align:center"><span class="coach">🗣️ “${FAULTS[PR.fault].fix}”</span></div><div class="hint" id="fixh">Watch ${g.first} try it again…</div>`);
  lbl(`${g.first} fixes it!`);
  play(buildAnim(sk,g,null),g,()=>{const h=document.getElementById('fixh');if(h)h.remove();
   if(now){confetti();ask.insertAdjacentHTML('beforeend',`<div class="msg ok" style="font-size:20px">🏅 ${g.first} MASTERED the ${sk.n}! +50 ⭐</div>`);const r=readyInfo(g);if(r&&r.ok)ask.insertAdjacentHTML('beforeend',`<div class="hint">⬆️ ${g.first} is ready to move up to ${r.lv.name}! (Tap her in the class list.)</div>`)}
   else ask.insertAdjacentHTML('beforeend',`<div class="hint">She fixed it! She's still learning — she'll need more practice.</div>`);
   ask.insertAdjacentHTML('beforeend',`<div class="row" style="margin-top:10px"><button class="btn" onclick="nextG()">Next gymnast →</button></div>`);});
 }else{
  S.st.no++;save();

  <div class="row" style="margin-top:10px"><button class="btn ghost" onclick="rewatch()">🔁 Watch again</button><button class="btn" onclick="nextG()">Next gymnast →</button></div>`);
 }
}

/* ============================ ROUTINES & MEETS ============================ */
const SETORDER=['mini','kinder','sparkle','rockets','amethyst','sapphire','ruby','diamond'];
const SETNAME={mini:'🐣 Mini Flippers',kinder:'🌈 Kinder Kartwheelers',sparkle:'✨ Beginner',rockets:'🚀 Rising Rockets',amethyst:'💜 Team Amethyst',sapphire:'💙 Team Sapphire',ruby:'❤️ Team Ruby',diamond:'💎 Team Diamond'};
const tier=s=>SETORDER.indexOf(s.set);
const sval=s=>(tier(s)+1)/10;
const RT_EVENTS=['vault','bars','beam','floor'],RT_MIN=4,RT_MAX=8;
const EV=id=>EVENTS.find(e=>e.id===id);
const fmt=x=>x.toFixed(3),r025=x=>Math.round(x*40)/40;
const RIVAL_GYMS=['Red Rock Tumblers','Wasatch Flyers','Timpanogos Twisters','Bonneville Elite','Canyon Kids Gym','Summit Stars Gymnastics','Desert Sky Gymnastics','Alpine Aerials','Salt Flats Flippers','Zion Gymnastics Club'];
const MEETS=['Snowflake Invitational','Red Rock Classic','Arches Challenge','Golden Spike Invitational','Wasatch Winter Cup','Sundance Showcase','Bryce Canyon Classic','Great Salt Lake Open','Pioneer Cup','Timpanogos Twist & Shout'];
function migrate(){for(const g of S.girls)for(const k in g.sk){const p=g.sk[k];if(p.need>MAXTRY)p.need=MAXTRY;if(!p.done&&p.p>=p.need){p.done=1;S.st.mast++}}
 S.routines=S.routines||{};S.meetDone=S.meetDone||{};S.meetLog=S.meetLog||[]}
function defaultRoutine(team){const ti=SETORDER.indexOf(LV[team].set),r={};
 for(const ev of RT_EVENTS){const pool=Object.values(SK).filter(s=>s.ev===ev&&tier(s)<=ti).sort((a,b)=>tier(a)-tier(b));
  r[ev]=ev==='vault'?[(pool.filter(s=>tier(s)===ti)[0]||pool[pool.length-1]).id]:pool.slice(-4).map(s=>s.id)}
 return r}
function routineOf(team){if(!S.routines[team])S.routines[team]=defaultRoutine(team);return S.routines[team]}
function startValue(ev,ids){
 if(!ids.length)return 0;
 if(ev==='vault')return Math.min(10,7.6+tier(SK[ids[0]])*0.3);
 const v=6.6+ids.reduce((a,id)=>a+sval(SK[id]),0)-Math.max(0,RT_MIN-ids.length)*0.5;return Math.min(10,Math.max(0,v))}
function perform(g,ev,ids){
 if(!ids.length)return{sv:0,ded:0,score:0,skills:[],falls:0};
 const sv=startValue(ev,ids);let ded=0.05+Math.random()*0.2*(1-g.talent*0.5),falls=0;const out=[];
 for(const id of ids){const s=SK[id],p=g.sk[id],dn=p&&p.done,fr=p?(dn?1:p.p/p.need):0;
  let d=dn?Math.random()*0.1:0.1+Math.random()*0.35*(1-fr)+0.05;if(ev==='vault')d*=2;
  const fall=Math.random()<(dn?0.03:0.1+0.4*(1-fr));if(fall){d+=0.5;falls++}
  ded+=d;out.push({id,fault:(d>0.12||fall)?pick(s.f):null,fall,d})}
 return{sv,ded,score:Math.max(ev==='vault'?6:4,r025(sv-ded)),skills:out,falls}}
function rivalGirl(col){const h=pick(HAIR),e=pick(EYES);return{first:pick(FIRST),last:pick(LAST),hairC:h[1],style:pick(STYLES),eyeC:e[1],skin:pick(SKIN),leoC:col,acc:pick(ACC),freck:Math.random()<.25,age:12}}
function rivalScore(team){const base={amethyst:8.85,sapphire:9.0,ruby:9.15,diamond:9.3}[team];let x=base+(Math.random()+Math.random()+Math.random()-1.5)*0.35;if(Math.random()<.1)x-=.5;return r025(Math.min(9.9,x))}

/* ---- routine editor ---- */
function rRoutine(){
 const l=LV[CUR.lvl],ev=CUR.ev,R=routineOf(l.id),ids=R[ev],gs=S.girls.filter(g=>g.lvl===l.id);
 const mc=id=>gs.filter(g=>g.sk[id]&&g.sk[id].done).length;
 const lib=Object.values(SK).filter(s=>s.ev===ev).sort((a,b)=>tier(a)-tier(b));
 const val=s=>ev==='vault'?'Start value '+fmt(Math.min(10,7.6+tier(s)*0.3)):'+'+sval(s).toFixed(1);
 const back=CUR.back==='meet'?"go('meet')":`go('cls',{lvl:'${l.id}'})`;
 $app.innerHTML=`<div class="top"><button class="btn ghost small" onclick="${back}">← ${CUR.back==='meet'?'Meet':l.name}</button><div class="title"><h1>📝 ${l.em} ${l.name} Routines</h1><div class="sub">Pick the skills and their order for each event</div></div></div>
 <div class="tabs">${RT_EVENTS.map(e=>`<button class="tab ${e===ev?'on':''}" onclick="CUR.ev='${e}';render()">${EV(e).e} ${EV(e).n}<small>${fmt(startValue(e,R[e]))}</small></button>`).join('')}</div>
 <div class="ask"><div class="q">${ev==='vault'?'Competition vault':EV(ev).n+' routine'}</div>
 <div class="msg">Start value: <b>${fmt(startValue(ev,ids))}</b> / 10.000</div>
 ${ev!=='vault'&&ids.length<RT_MIN?`<div class="hint" style="color:var(--bad)">⚠️ A routine needs at least ${RT_MIN} skills. Each missing skill costs 0.5.</div>`:''}
 ${ids.length?'':'<div class="hint">No skills yet. Add some from the list below.</div>'}
 ${ids.map((id,i)=>{const s=SK[id];return`<div class="sk"><b style="width:22px">${i+1}.</b><div class="n">${s.n}<div class="m">${SETNAME[s.set]} · ${val(s)} · ${mc(id)}/${gs.length} mastered</div></div>
  ${ev!=='vault'?`<button class="btn ghost small" ${i?'':'disabled'} onclick="rtMove(${i},-1)">↑</button><button class="btn ghost small" ${i<ids.length-1?'':'disabled'} onclick="rtMove(${i},1)">↓</button>`:''}<button class="btn ghost small" onclick="rtDel(${i})">✕</button></div>`}).join('')}
 </div>
 <div class="sect">All ${EV(ev).n} skills ${ev==='vault'?'(pick one)':`(up to ${RT_MAX})`}</div>
 <div class="events">${SETORDER.map(st=>{const ss=lib.filter(s=>s.set===st);if(!ss.length)return'';return`<div class="ev"><h3 style="font-size:15px">${SETNAME[st]}</h3>${ss.map(s=>{const inR=ids.includes(s.id);
  return`<div class="sk"><div class="n">${s.n}<div class="m">${val(s)} · ${mc(s.id)}/${gs.length} mastered</div></div><button class="btn small ${inR?'ghost':'pink'}" ${inR||(ev!=='vault'&&ids.length>=RT_MAX)?'disabled':''} onclick="rtAdd('${s.id}')">${inR?'✓ In':'+ Add'}</button></div>`}).join('')}</div>`}).join('')}</div>
 <div class="hint">Harder skills raise the start value, but gymnasts lose points on skills they haven't mastered, and they might fall! You can coach any routine skill from the team page.</div>`;
}
function rtAdd(id){const R=routineOf(CUR.lvl),ev=CUR.ev;if(ev==='vault')R.vault=[id];else if(!R[ev].includes(id)&&R[ev].length<RT_MAX)R[ev].push(id);save();render()}
function rtDel(i){routineOf(CUR.lvl)[CUR.ev].splice(i,1);save();render()}
function rtMove(i,d){const a=routineOf(CUR.lvl)[CUR.ev],j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();render()}

/* ---- meets ---- */
let MT=null;
function meetReady(team){return S.girls.some(g=>g.lvl===team)&&S.meetDone[team]!==S.season}
function startMeet(team){
 if(!meetReady(team))return;const gs=S.girls.filter(g=>g.lvl===team);
 const gyms=[{name:'Spencer Gymnastics Academy',own:1,girls:gs.map(g=>({g,first:g.first,last:g.last,sc:{},shown:{}}))}];
 shuffle(RIVAL_GYMS).slice(0,3).forEach(n=>{const col=pick(LEOS)[1],girls=[];for(let i=0,k=3+rnd(2);i<k;i++){const rg=rivalGirl(col);girls.push({g:rg,first:rg.first,last:rg.last,sc:{}})}gyms.push({name:n,girls})});
 for(const gm of gyms.slice(1))for(const x of gm.girls)for(const ev of RT_EVENTS)x.sc[ev]=rivalScore(team);
 MT={team,name:MEETS[(S.season-1)%MEETS.length],gyms,ev:0,gi:0,phase:'intro',tok:0};go('meet');
}
function meetGo(){const R=routineOf(MT.team);for(const x of MT.gyms[0].girls){x.perf={};for(const ev of RT_EVENTS){x.perf[ev]=perform(x.g,ev,R[ev]);x.sc[ev]=x.perf[ev].score}}
 S.meetDone[MT.team]=S.season;save();MT.phase='event';MT.ev=0;MT.gi=0;render()}
function rMeet(){if(!MT)return go('home');if(MT.phase==='intro')return meetIntro();if(MT.phase==='final')return meetFinal();meetEvent()}
function meetIntro(){const l=LV[MT.team],R=routineOf(MT.team);

 <div class="ask"><div class="q">Competing gyms</div>${MT.gyms.map(gm=>`<div class="mrow ${gm.own?'own':''}">${gm.girls.slice(0,5).map(x=>face(x.g)).join('')}<b>${gm.name}</b><span class="r">${gm.girls.length} gymnasts</span></div>`).join('')}</div>
 <div class="ask" style="margin-top:12px"><div class="q">Your routines</div>${RT_EVENTS.map(ev=>`<div class="mrow">${EV(ev).e} <b>${EV(ev).n}</b> ${R[ev].map(id=>SK[id].n).join(' → ')||'<i>empty!</i>'}<span class="r">SV ${fmt(startValue(ev,R[ev]))}</span></div>`).join('')}</div>
 <div class="row" style="margin-top:14px"><button class="btn ghost" onclick="go('routine',{lvl:MT.team,ev:'vault',back:'meet'})">📝 Edit routines</button><button class="btn pink" onclick="meetGo()">Start the meet! 🎉</button></div>
 <div class="hint">Once the meet starts, ${l.name} is done competing until next season.</div>`}
function meetEvent(){
 const ev=RT_EVENTS[MT.ev];
 $app.innerHTML=`<div class="top"><div class="title"><h1>🏆 ${MT.name}</h1><div class="sub">Event ${MT.ev+1} of 4 · ${EV(ev).e} ${EV(ev).n}</div></div><button class="btn ghost small" onclick="meetSkipAll()">⏩ Skip to final results</button></div>

function meetWho(x,ev,txt){const own=MT.gyms[0].girls;document.getElementById('who').innerHTML=`${face(x.g)}<div style="flex:1"><div class="nm">${x.first} <span style="font-size:14px;opacity:.6">${EV(ev).n}</span></div><div style="font-size:14px;font-weight:800">${txt}</div></div>
 <div class="line">${own.map((y,i)=>face(y.g).replace('<svg ',`<svg class="${i===MT.gi?'cur':i<MT.gi?'dn':''}" `)).join('')}</div>`}

function rankRows(get){const rows=[];for(const gm of MT.gyms)for(const x of gm.girls){const v=get(x,gm);if(v!=null)rows.push({x,gm,v})}rows.sort((a,b)=>b.v-a.v);let r=0,prev=null;rows.forEach((o,i)=>{if(o.v!==prev){r=i+1;prev=o.v}o.rank=r});return rows}
const MED=['','🥇','🥈','🥉'];
function rowHTML(o,final){return`<div class="mrow ${o.gm.own?'own':''}"><b style="width:26px">${final&&o.rank<=3?MED[o.rank]:o.rank+'.'}</b>${face(o.x.g)}<div><b>${o.x.first} ${o.x.last}</b><div style="font-size:12px;opacity:.6">${o.gm.name}</div></div><span class="r">${fmt(o.v)}</span></div>`}

  const l=LV[g.lvl];if(l.max<g.age&&!l.team){const to=g.age<=6?'kinder':g.age<=10?'sparkle':l.id==='sparkle'?'stars':null;if(to&&to!==g.lvl){g.lvl=to;moved.push(g.first+' → '+LV[to].name)}}}

/* ===== Sync (GitHub) — GitHub Pages build only ===== */
const Sync=(()=>{
 const GH={owner:"ShawnJSpencer",repo:"gym-academy",branch:"sync-data",path:"sync.json"};
 const API=`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${GH.path}`;
 const LSg=k=>{try{return localStorage.getItem(k)||""}catch(e){return ""}};
 const LSs=(k,v)=>{try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(e){}};
 // Same site as Wild Run, Agility Club and the NFL app, so a key saved there is tried first; it only sticks if it can reach gym-academy.
 let token=LSg("gym.ghtoken"),borrowed=false;
 if(!token&&LSg("gym.sync")!=="off"){token=LSg("agility.ghtoken")||LSg("wildrun.ghtoken")||LSg("sfe.ghtoken");borrowed=!!token;if(borrowed)LSs("gym.firstsync","1");}
 let busy=false,again=false,timer=null,status=token?"idle":"off",lastOk=0;
 const hdr=t=>({Authorization:"Bearer "+(t||token),Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"});
 const b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,"")),c=>c.charCodeAt(0)));
 const b64e=s=>{let x="";new TextEncoder().encode(s).forEach(c=>x+=String.fromCharCode(c));return btoa(x)};
 const all=()=>{const p={};COACHES.forEach(c=>{const s=c.n===COACH&&S?S:load(c.n);if(s)p[c.n]=s});return{v:1,players:p}};
 async function pull(){
  const r=await fetch(`${API}?ref=${GH.branch}&_=${Date.now()}`,{headers:hdr(),cache:"no-store"});
  if(r.status===404)return{data:null,sha:null};
  if(!r.ok)throw new Error(String(r.status));
  const j=await r.json();let data=null;try{data=JSON.parse(b64d(j.content||""))}catch(e){}
  return{data,sha:j.sha};
 }
 async function push(sha){
  const body={message:"sync",content:b64e(JSON.stringify(all())),branch:GH.branch};if(sha)body.sha=sha;
  const r=await fetch(API,{method:"PUT",headers:Object.assign(hdr(),{"Content-Type":"application/json"}),body:JSON.stringify(body)});
  if(r.status===409||r.status===422)return false;
  if(!r.ok)throw new Error(String(r.status));
  return true;
 }
 // Each coach's gym syncs separately: the newer save wins. On a device's first sync, saved gyms win over this device.
 function merge(remote){
  const rp=(remote&&remote.v===1&&remote.players)||{},first=LSg("gym.firstsync")==="1";let changed=[],pushIt=!remote;
  COACHES.forEach(({n})=>{
   const r=rp[n],l=n===COACH&&S?S:load(n);
   if(r&&(!l||first||(r.u||0)>(l.u||0))){if(JSON.stringify(r)!==JSON.stringify(l)){try{localStorage.setItem(KEY(n),JSON.stringify(r))}catch(e){}changed.push(n)}}
   else if(l&&(!r||(l.u||0)>(r.u||0)))pushIt=true;
  });
  return{changed,push:pushIt};
 }
 const busyScreen=()=>SCREEN==='practice'||SCREEN==='meet'||$m.classList.contains('on');
 async function run(){
  if(!token)return;
  if(busyScreen()){clearTimeout(timer);timer=setTimeout(run,8000);return} // never swap saves mid-practice or mid-meet
  if(!navigator.onLine){setStatus("error");return}
  if(busy){again=true;return}
  busy=true;clearTimeout(timer);setStatus("syncing");
  try{
   let ok=false;
   for(let i=0;i<4&&!ok;i++){
    const {data,sha}=await pull();
    if(busyScreen())break;
    const m=merge(data);
    if(m.changed.length){
     if(COACH&&m.changed.includes(COACH)){S=load(COACH);migrate();if(SCREEN==='cls'&&!LV[CUR.lvl])go('home');else render()}
     else if(SCREEN==='who')render();}
    ok=!m.push||await push(sha);
   }
   LSs("gym.firstsync","");
   if(borrowed){LSs("gym.ghtoken",token);borrowed=false;}
   lastOk=Date.now();setStatus("ok");
  }catch(e){
   if(borrowed){token="";borrowed=false;LSs("gym.firstsync","");setStatus("off");}
   else setStatus(["401","403","404"].includes(e.message)?"badtoken":"error");
  }
  busy=false;if(again){again=false;run()}
 }
 function soon(){if(!token)return;clearTimeout(timer);timer=setTimeout(run,2500)}
 function ago(){const s=Math.round((Date.now()-lastOk)/1000);return s<20?"just now":s<3600?Math.round(s/60)+" min ago":"a while ago"}
 function setStatus(s){status=s;paint()}
 function paint(){const b=document.getElementById("syncBtn");if(!b)return;
  const map={off:["off","Sync iPhone + iPad"],idle:["","Synced"],syncing:["busy","Syncing…"],ok:["","Synced · "+ago()],error:["warn","Offline · will retry"],badtoken:["warn","Sync key not working · tap to fix"]};
  const [cls,txt]=map[status]||map.off;b.className="syncbtn "+cls;b.querySelector("span").textContent=txt;}
 async function check(t){
  const r=await fetch(`https://api.github.com/repos/${GH.owner}/${GH.repo}`,{headers:hdr(t),cache:"no-store"});
  if(r.status===401)return"GitHub didn't accept that key. Make sure you copied the whole thing.";
  if(r.status===404)return"That key can't see the gym-academy repo. Give it access to gym-academy.";
  if(!r.ok)return"GitHub said "+r.status+". Try again in a minute.";
  const j=await r.json();
  if(j.permissions&&j.permissions.push===false)return'That key is read-only. Set Contents to "Read and write".';
  return"";}
 return{get on(){return!!token},run,soon,paint,check,
  setToken(t){token=t;borrowed=false;LSs("gym.ghtoken",t);LSs("gym.sync",t?"":"off");LSs("gym.firstsync",t?"1":"");status=t?"idle":"off";paint();if(t)run();}};
})();
syncHook=()=>Sync.soon();

 <div class="row"><button class="btn small" id="tokPaste">Paste key</button><button class="btn small pink" id="tokSave">Save</button><button class="btn small ghost" id="tokOff" hidden>Turn off sync</button><button class="btn small ghost" id="tokClose">Close</button></div></div>`;
 document.body.appendChild(sh);
 const msgTok=(t,c)=>{$("tokMsg").textContent=t;$("tokMsg").className="tokmsg "+(c||"");};
 btn.onclick=()=>{$("tok").value="";msgTok("");$("tokOff").hidden=!Sync.on;$("sheetState").textContent=Sync.on?"Sync is on for this device.":"Sync is off for this device. When you turn it on, this device loads the family's saved gyms.";sh.hidden=false;};

  $("tok").value=m[1];$("tokSave").click();};

const APP_VERSION='1794705117';

(function(){
 async function check(){
  if(SCREEN==='practice'||SCREEN==='meet')return; // never interrupt practice or a meet
  try{
   const r=await fetch("version.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)return;
   const v=String((await r.json()).v||"");if(!v||v===APP_VERSION)return;
   let tried="";try{tried=sessionStorage.getItem("gym.tried")||""}catch(e){}
   if(tried===v)return;
   try{sessionStorage.setItem("gym.tried",v)}catch(e){}
   saveLocal();location.replace(location.pathname+"?v="+encodeURIComponent(v));
  }catch(e){}
 }
